<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img src="assets/icons/logo-96.png" alt="" width="36" height="36">
      <span>MamaCircle</span>
    </a>
    <nav class="header-nav">
      <a href="index.html#about" data-i18n="nav.about">Om oss</a>
      <a href="features.html" data-i18n="nav.features">Funksjoner</a>
      <a href="faq.html" data-i18n="nav.faq">Spørsmål</a>
      <a href="contact.html" data-i18n="nav.contact">Kontakt</a>
      <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">EN</button>
    </nav>
  </div>
</header>

<main>

  <section id="write-note" class="note write-note">
    <div class="wrap note-inner">
      <h2 data-i18n="note.write_heading">Legg igjen en hilsen</h2>
      <p data-i18n="note.write_body">Del en liten hilsen med andre mødre i kretsen, anonymt om du vil.</p>
      <form id="note-form" class="note-form">
        <textarea id="note-text-input" required maxlength="500" rows="4"
                  data-i18n-placeholder="note.write_placeholder"
                  placeholder="Skriv din hilsen her..."
                  aria-label="Your note"></textarea>
        <label for="note-author-input" data-i18n="note.write_author_label">Hvor er du fra? (valgfritt)</label>
        <input type="text" id="note-author-input" maxlength="80"
               data-i18n-placeholder="note.write_author_placeholder"
               placeholder="F.eks. En mamma i Oslo">
        <button type="submit" class="btn btn-primary" data-i18n="note.write_button">Send hilsen</button>
      </form>
      <p class="note-form-note" data-i18n="note.write_note">Hilsener blir lest gjennom før de eventuelt deles videre i kretsen.</p>
      <p id="note-status" class="newsletter-status" hidden></p>
    </div>
  </section>

</main>
